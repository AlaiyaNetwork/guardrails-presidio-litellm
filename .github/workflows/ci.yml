name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/alaiyanetwork/guardrails-presidio-litellm

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for tests
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: guardrails-presidio-litellm:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start adapter
        run: |
          docker run -d --rm \
            --name guardrails-presidio \
            -p 5002:5002 \
            guardrails-presidio-litellm:ci

      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5002/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs guardrails-presidio
          exit 1

      - name: Smoke test Presidio API
        run: sh scripts/smoke-test.sh

      - name: Container logs on failure
        if: failure()
        run: docker logs guardrails-presidio || true

  publish:
    if: github.event_name != 'pull_request'
    needs: build-and-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-
            type=ref,event=tag

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
