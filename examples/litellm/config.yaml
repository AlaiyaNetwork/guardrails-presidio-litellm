guardrails:
  - guardrail_name: pii_masking
    litellm_params:
      guardrail: presidio
      mode: pre_call
      default_on: true
      output_parse_pii: true

# Keep the existing LiteLLM Presidio integration. Both URLs can point to the
# same compatibility service.
environment_variables:
  PRESIDIO_ANALYZER_API_BASE: http://guardrails-presidio:5002
  PRESIDIO_ANONYMIZER_API_BASE: http://guardrails-presidio:5002
